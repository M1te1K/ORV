name: Build Windows executable

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
    paths:
      - orvi.py
      - ORVISimulator.spec
      - sounds/**
      - scripts/build_windows.ps1
      - .github/workflows/build-windows.yml

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install pyinstaller==6.16.0 pywin32
      - name: Verify Windows controls
        run: python -m unittest discover -s tests -p test_controls.py -v
      - name: Build executable archive
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ORVISimulator-Windows-x64
          path: releases/ORVISimulator-Windows-x64.zip
          if-no-files-found: error

  commit-binary:
    if: github.ref_type == 'branch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ORVISimulator-Windows-x64
          path: releases
      - name: Commit current Windows build
        env:
          BUILD_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/ORVISimulator-Windows-x64.zip
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build current Windows executable'
          git push origin "HEAD:$BUILD_BRANCH"
